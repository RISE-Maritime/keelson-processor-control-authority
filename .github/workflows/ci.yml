name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --locked --extra dev --python 3.13
      - name: Lint
        run: uv run --locked ruff check .
      - name: Unit tests
        run: uv run --locked pytest -vv
