[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keelson-processor-control-authority"
version = "0.1.0"
description = "The onboard authority manager: role leases, assignments, the navigation authority document and the two-phase motion transfer with the control gate (keelson protocols/command_authority.yaml)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # EXACT pin, never a path or a range. The types (role leases, CommandAssignment, ControlMapping,
    # TransferPrepare/Ack/Commit, Fence), the attestation (#383) and the maintenance calls (#377) exist
    # only on open keelson PRs; this experimental build (0.6.0-experimental.23, its tag is the manifest)
    # carries them, tracked by crowsnest-dev #84. Repin to the release that carries them when they merge.
    "keelson==0.6.0.dev23",
    # Ed25519 for the ROC service's attestation (crowsnest-dev#312).
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.14.11"]

[tool.setuptools]
packages = ["control_authority"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end test that runs the CLI against an isolated loopback Zenoh peer and a fake gate"]

[tool.ruff]
line-length = 140
